[package]
name = "knave-app"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Standalone window host for Knave UI applications"

[dependencies]
knave-ui.workspace = true
knave-renderer = { path = "../knave-renderer" }
wgpu.workspace = true
pollster.workspace = true
winit = "0.30.13"
arboard = { version = "3.6", default-features = false }

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
smithay-clipboard = "0.7"

[dev-dependencies]
knave-config = { git = "https://github.com/knave-de/knave.git", rev = "ece467b47c942bdc0fe7e0dea73088a8c31ca98e" }
