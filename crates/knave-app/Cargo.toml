[package]
name = "knave-app"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Standalone window host for Knave UI applications"

[dependencies]
knave-ui.workspace = true
knave-renderer = { path = "../knave-renderer" }
wgpu.workspace = true
pollster.workspace = true
winit = "0.30.13"
arboard = { version = "3.6", default-features = false }
knave-config = { git = "https://github.com/knave-de/knave.git", rev = "f71ed909aad0c4f6772654c04b355fe09d9db361" }

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
smithay-clipboard = "0.7"

[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "1", features = ["fs", "event"] }
