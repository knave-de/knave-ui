[workspace]
members = ["crates/knave-ui", "crates/knave-renderer", "crates/knave-app"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
bytemuck = { version = "1", features = ["derive"] }
glyphon = "0.12.0"
knave-ui = { path = "crates/knave-ui" }
png = "0.18"
pollster = "1.0.1"
wgpu = "30.0.1"
